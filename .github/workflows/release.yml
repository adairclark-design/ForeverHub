name: Release ForeverHub Addon

on:
  push:
    tags:
      - "v*"
      - "!*-src"

permissions:
  contents: read

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Release Tag (No Persisted Credentials)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Fetch Matching Source Tag & Verify Provenance + Release Bundle
        env:
          TAG_NAME: ${{ github.ref_name }}
          REPO_SLUG: ${{ github.repository }}
        run: |
          set -euo pipefail
          case "${TAG_NAME}" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "ERROR: Invalid release tag syntax: ${TAG_NAME}" >&2; exit 1 ;;
          esac
          git fetch --no-tags "https://github.com/${REPO_SLUG}.git" "refs/tags/${TAG_NAME}-src:refs/tags/${TAG_NAME}-src"
          python3 scripts/verify_exported_release.py \
            --tag "${TAG_NAME}" \
            --require-source-tag \
            --emit-release-bundle "${RUNNER_TEMP}/fh-release-bundle"

      - name: Upload 3 Approved Forever Assets to Draft, Verify Round-Trip, Then Publish Immutable Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
          REPO_SLUG: ${{ github.repository }}
        run: |
          set -euo pipefail
          BUNDLE_DIR="${RUNNER_TEMP}/fh-release-bundle"
          VERIFY_DIR="${RUNNER_TEMP}/fh-draft-verify"
          # Upload ONLY ForeverHub-${{ github.ref_name }}-forever.zip, .sha256, and release.json (never unsuffixed .zip)
          gh release create "${TAG_NAME}" \
            --repo "${REPO_SLUG}" \
            --draft \
            --verify-tag \
            --title "ForeverHub ${TAG_NAME}" \
            --notes-file "${BUNDLE_DIR}/RELEASE_NOTES.md" \
            "${BUNDLE_DIR}/ForeverHub-${TAG_NAME}-forever.zip" \
            "${BUNDLE_DIR}/ForeverHub-${TAG_NAME}-forever.zip.sha256" \
            "${BUNDLE_DIR}/release.json"
          mkdir -p "${VERIFY_DIR}"
          gh release download "${TAG_NAME}" --repo "${REPO_SLUG}" --dir "${VERIFY_DIR}"
          python3 scripts/verify_exported_release.py \
            --tag "${TAG_NAME}" \
            --require-source-tag \
            --verify-downloaded-dir "${VERIFY_DIR}"
          gh release edit "${TAG_NAME}" --repo "${REPO_SLUG}" --draft=false --latest
