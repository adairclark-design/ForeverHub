name: Release ForeverHub Addon

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Verify Tag, TOC, Manifest & Exact Prebuilt Archive Bytes (No Recompression)
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          python3 scripts/verify_exported_release.py --tag "${TAG_NAME}"

      - name: Publish Verified Release Assets
        env:
          VER: ${{ github.ref_name }}
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          fail_on_unmatched_files: true
          files: |
            dist/ForeverHub-${{ github.ref_name }}.zip
            dist/ForeverHub-${{ github.ref_name }}.zip.sha256
            dist/ForeverHub-${{ github.ref_name }}-forever.zip
            dist/ForeverHub-${{ github.ref_name }}-forever.zip.sha256
          generate_release_notes: true
